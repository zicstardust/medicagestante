[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medicagestante"
version = "0.1.0"
description = "Aplicativo para gestão de pacientes em clínicas de obstetrícia e ginecologia."
requires-python = ">=3.14.8"

dependencies = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
]

# Configuração para ignorar pastas que não contêm módulos Python
[tool.setuptools.packages.find]
where = ["."]
exclude = ["static*", "templates*"]