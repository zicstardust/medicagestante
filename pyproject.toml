[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medicagestante"
version = "0.1.0"
description = "Aplicativo para gestão de pacientes em clínicas de obstetrícia e ginecologia."
requires-python = ">=3.14"

dependencies = [
    "flask>=3.1.3",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=26.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["static*", "templates*"]